name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Secret SONAR_TOKEN is not set."
            echo "Create a token at https://sonarcloud.io → My Account → Security"
            echo "Then add it under Repo Settings → Secrets and variables → Actions → SONAR_TOKEN"
            echo "Project key expected: venturalabs-ai_ventura-agents"
            echo "Organization: venturalabs-ai"
            exit 1
          fi
          echo "SONAR_TOKEN is configured."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python analysis deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pydantic pydantic-settings ruff
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || true
          fi

      - name: Node typecheck + tests
        run: |
          npm run typecheck
          npm test || true
          mkdir -p coverage

      - name: Python tests with coverage
        run: |
          if [ -d tests ]; then
            pytest tests/ -q \
              --cov=agents --cov=core --cov=src \
              --cov-report=xml:coverage.xml \
              --tb=short || true
          else
            echo "No Python tests directory; skipping coverage.xml"
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
